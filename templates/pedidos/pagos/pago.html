{% extends "base.html" %}

{% block title %}
Pago
{% endblock %}

{% block content %}

<h1>Pago</h1>

{% if pago %}
    <p>Pago pendiente</p>

    <form 
        action="{% url 'pedidos:confirmar_pago' pedido.pk %}" 
        method="post"
    >
        {% csrf_token %}
        <button type="submit">
            Confirmar pago
        </button>
    </form>
{% else %}
    <p>No existe un pago pendiente.</p>
{% endif %}

{% endblock %}
