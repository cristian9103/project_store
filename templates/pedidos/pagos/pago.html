{% extends "base.html" %}

{% block title %}
    Pago
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-mb-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4">Pago</h1>

                    {% if pago %}
                        <div class="alert alert-info" role="alert">
                            Pago pendiente
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Pedido</span>
                                <span class="fw-semibold">#{{ pedido.pk }}</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span>Total</span>
                                <span class="fw-bold">${{ pedido.total }}</span>
                            </div>
                        </div>

                        <form 
                            action="{% url 'pedidos:confirmar_pago' pedido.pk %}" 
                            method="post"
                        >
                            {% csrf_token %}

                            <button 
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Confirmar pago
                            </button>
                        </form>

                    {% else %}
                        <div class="alert alert-warning" role="alert">
                            No existe un pago pendiente.
                        </div>

                        <a 
                            href="{% url 'pedidos:checkout' %}"
                            class="btn btn-outline-primary w-100"
                        >
                            Volver al checkout
                        </a>
                    {% endif %}

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
