<form method="get" class="row g-3 align-items-end mb-4">

    <div class="col-12 col-md-5">
        <label 
            for="{{ form.buscar.id_for_label }}"
            class="form-label"
        >
            {{ form.buscar.label }}
        </label>

        {{ form.buscar}}
    </div>

    <div class="col-12 col-md-3">
        <label 
            for="{{ form.categoria.id_for_label }}"
            class="form-label"    
        >
            {{ form.categoria.label }}
        </label>

        {{ form.categoria }}
    </div>

    <div class="col-12 col-md-3">
        <label 
            for="{{ form.marca.id_for_label }}"
            class="form-label"
        >
            {{ form.marca.label }}
        </label>

        {{ form.marca }}
    </div>

    <div class="col-12 col-md-1">
        <button 
            type="submit"
            class="btn btn-primary w-100"
        >
            Buscar
        </button>
    </div>

</form>
