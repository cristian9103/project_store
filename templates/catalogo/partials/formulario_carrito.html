<form 
    id="agregar-carrito" 
    method="post"
    action="{% url 'pedidos:agregar_producto' producto.pk %}"
>
    {% csrf_token %}

    {{ form.non_field_errors }}

    <div>
        {{ form.cantidad.label_tag }}

        {{ form.cantidad }}

        {{ form.cantidad.errors }}
    </div>

    <button type="submit">
        Agregar al carrito
    </button>
</form>
